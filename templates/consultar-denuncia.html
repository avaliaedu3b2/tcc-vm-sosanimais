<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Consultar denúncia - SOS Animais Matão</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
  }

  :root {
    --purple-light: #f4ecfb;
    --purple-main: #9d59d6;
    --purple-dark: #7f43b8;
    --purple-accent: #ce93d8;
    --text-dark: #1a1123;
    --text-muted: #777;
    --white: #fff;
    --gray-bg: #ffffff;
  }

  body {
    color: var(--text-dark);
    background: var(--gray-bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ══ Cabeçalho com a marca SOS Animais Matão (igual ao login) ══ */
  .navbar {
    width: 100%;
    background: #fff;
    border-bottom: 1px solid #ede0f3;
    padding: 14px 0;
  }
  .navbar .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .navbar-brand {
    font-family: 'Fraunces', serif;
    font-size: 1.3rem;
    font-weight: 900;
    color: #6a1b9a;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .navbar-brand .logo-icon {
    width: 38px;
    height: 38px;
    background: #9c27b0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .navbar-brand .logo-icon i {
    color: #fff;
    font-size: 1.1rem;
  }
  .navbar .menu-link {
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: var(--purple-main);
    border: 2px solid var(--purple-main);
    padding: 8px 18px;
    border-radius: 25px;
    font-size: 0.85rem;
    font-weight: bold;
    transition: 0.2s;
  }
  .navbar .menu-link:hover {
    background-color: var(--purple-main);
    color: white;
  }

  .content-wrap {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 40px 16px 48px;
  }

  h1, .display-font { font-family: 'Fraunces', serif; }

  .card {
    background: var(--white);
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(106, 27, 154, 0.08);
    max-width: 480px;
    width: 100%;
    padding: 40px;
    margin-top: 20px;
    align-self: center;
  }
  h2.title {
    font-family: 'Fraunces', serif;
    font-size: 1.7rem;
    font-weight: 900;
    color: var(--text-dark);
    margin-bottom: 8px;
    text-align: center;
  }
  p.subtitle {
    color: var(--text-muted);
    font-size: .92rem;
    line-height: 1.5;
    text-align: center;
    margin-bottom: 28px;
  }
  label {
    color: var(--purple-main);
    font-size: 0.78rem;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    display: block;
    margin-bottom: 8px;
  }
  input#codigoInput {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: .95rem;
    text-transform: uppercase;
    outline: none;
    transition: 0.2s;
    background: #fff;
  }
  input#codigoInput:focus {
    border-color: var(--purple-main);
    box-shadow: 0 0 0 3px rgba(157, 89, 214, 0.12);
  }
  button#btnBuscar {
    width: 100%;
    border: none;
    background: linear-gradient(135deg, var(--purple-main), var(--purple-dark));
    color: white;
    padding: 15px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 18px;
    transition: 0.2s;
  }
  button#btnBuscar:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(126, 67, 184, 0.3);
  }
  button#btnBuscar:disabled {
    opacity: .7;
    cursor: not-allowed;
    transform: none;
  }

  .resultado {
    margin-top: 26px;
    display: none;
  }
  .resultado.show { display: block; }
  .status-badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 999px;
    font-weight: 700;
    font-size: .85rem;
    margin-bottom: 16px;
  }
  .status-recebida { background: var(--purple-light); color: var(--purple-dark); }
  .status-analise { background: #fff3cd; color: #8a6d1a; }
  .status-atendida, .status-resolvida { background: #e8f5e9; color: #2e7d32; }
  .status-arquivada { background: #eee; color: #666; }

  .detalhe-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #f0eef5;
    font-size: .9rem;
  }
  .detalhe-row span.label-item { color: var(--text-muted); }
  .detalhe-row span.valor-item { font-weight: 600; text-align: right; }

  .foto-vistoria {
    margin-top: 18px;
  }
  .foto-vistoria .rotulo-foto {
    font-weight: 600;
    font-size: .82rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--purple-dark);
    display: block;
    margin-bottom: 8px;
  }
  .foto-vistoria img {
    width: 100%;
    border-radius: 12px;
    display: block;
  }

  .mensagem-orgao {
    margin-top: 18px;
    background: var(--purple-light);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: .88rem;
    color: var(--text-dark);
    line-height: 1.5;
  }
  .mensagem-orgao strong {
    display: block;
    color: var(--purple-dark);
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    margin-bottom: 6px;
  }

  .erro-msg {
    margin-top: 15px;
    padding: 11px;
    border-radius: 8px;
    background-color: #fff0f0;
    color: #d32f2f;
    text-align: center;
    font-size: 0.85rem;
    display: none;
  }

  @media (max-width: 860px) {
    .card { padding: 28px 24px; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a class="navbar-brand" href="/">
      <div class="logo-icon"><i class="bi bi-heart-fill"></i></div>
      SOS Animais Matão
    </a>
    <a href="/" class="menu-link">← Voltar</a>
  </div>
</nav>

<div class="content-wrap">
  <div class="card">
    <h2 class="title">Consultar denúncia</h2>
    <p class="subtitle">Digite o código do protocolo que você recebeu ao enviar a denúncia.</p>

    <label for="codigoInput">Código do protocolo</label>
    <input type="text" id="codigoInput" placeholder="SOS-2026-XXXXXX">
    <button id="btnBuscar">Consultar status</button>

    <p class="erro-msg" id="erroMsg"></p>

    <div class="resultado" id="resultado">
      <span class="status-badge" id="statusBadge"></span>
      <div class="detalhe-row"><span class="label-item">Protocolo</span><span class="valor-item" id="rCodigo"></span></div>
      <div class="detalhe-row"><span class="label-item">Tipo de animal</span><span class="valor-item" id="rTipoAnimal"></span></div>
      <div class="detalhe-row"><span class="label-item">Urgência</span><span class="valor-item" id="rUrgencia"></span></div>
      <div class="detalhe-row"><span class="label-item">Endereço</span><span class="valor-item" id="rEndereco"></span></div>
      <div class="detalhe-row"><span class="label-item">Enviada em</span><span class="valor-item" id="rData"></span></div>

      <div class="foto-vistoria" id="fotoVistoriaBox" style="display:none;">
        <span class="rotulo-foto">Foto da vistoria</span>
        <img id="rFotoVistoria" src="" alt="Foto enviada pelo órgão responsável">
      </div>

      <div class="mensagem-orgao" id="mensagemOrgaoBox" style="display:none;">
        <strong>Mensagem do órgão responsável</strong>
        <span id="rMensagemOrgao"></span>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCKKcD1NYxO_sJVevtwoHom95pNdAwLRUw",
    authDomain: "projetoeq2alexandremarra.firebaseapp.com",
    projectId: "projetoeq2alexandremarra",
    storageBucket: "projetoeq2alexandremarra.firebasestorage.app",
    messagingSenderId: "242522510582",
    appId: "1:242522510582:web:f8bda55c7bf29b189b48d7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const codigoInput = document.getElementById("codigoInput");
  const btnBuscar = document.getElementById("btnBuscar");
  const erroMsg = document.getElementById("erroMsg");
  const resultado = document.getElementById("resultado");

  function statusClasse(status) {
    const s = (status || "").toLowerCase();
    if (s.includes("recebida")) return "status-recebida";
    if (s.includes("análise") || s.includes("analise")) return "status-analise";
    if (s.includes("atendida") || s.includes("resolvida")) return "status-atendida";
    if (s.includes("arquivada")) return "status-arquivada";
    return "status-recebida";
  }

  async function buscar() {
    const codigo = codigoInput.value.trim().toUpperCase();
    erroMsg.style.display = "none";
    resultado.classList.remove("show");

    if (!codigo) return;

    btnBuscar.disabled = true;
    btnBuscar.textContent = "Buscando...";

    try {
      const snap = await getDoc(doc(db, "denuncias", codigo));
      if (!snap.exists()) {
        erroMsg.textContent = "Nenhuma denúncia encontrada com esse código. Confira e tente de novo.";
        erroMsg.style.display = "block";
        return;
      }
      const d = snap.data();
      const badge = document.getElementById("statusBadge");
      badge.textContent = d.status || "Recebida";
      badge.className = "status-badge " + statusClasse(d.status);

      document.getElementById("rCodigo").textContent = codigo;
      document.getElementById("rTipoAnimal").textContent = d.tipoAnimal || "-";
      document.getElementById("rUrgencia").textContent = d.urgencia || "-";
      document.getElementById("rEndereco").textContent = d.endereco || "-";
      document.getElementById("rData").textContent = d.criadoEm ? new Date(d.criadoEm).toLocaleString("pt-BR") : "-";

      // Foto da vistoria: só aparece depois que o órgão analisou a denúncia
      // (status diferente de "Recebida") e anexou uma foto.
      const fotoBox = document.getElementById("fotoVistoriaBox");
      const statusAtual = (d.status || "").toLowerCase();
      const jaAnalisada = statusAtual && statusAtual !== "recebida";

      if (jaAnalisada && d.anexoFotoUrl) {
        document.getElementById("rFotoVistoria").src = d.anexoFotoUrl;
        fotoBox.style.display = "block";
      } else {
        fotoBox.style.display = "none";
      }

      // Mensagem do órgão para o denunciante, se houver
      const mensagemBox = document.getElementById("mensagemOrgaoBox");
      if (jaAnalisada && d.mensagemDenunciante) {
        document.getElementById("rMensagemOrgao").textContent = d.mensagemDenunciante;
        mensagemBox.style.display = "block";
      } else {
        mensagemBox.style.display = "none";
      }

      resultado.classList.add("show");
    } catch (erro) {
      console.error(erro);
      erroMsg.textContent = "Não foi possível consultar agora. Tente novamente em instantes.";
      erroMsg.style.display = "block";
    } finally {
      btnBuscar.disabled = false;
      btnBuscar.textContent = "Consultar status";
    }
  }

  btnBuscar.addEventListener("click", buscar);
  codigoInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") buscar();
  });

  const params = new URLSearchParams(window.location.search);
  const codigoParam = params.get("codigo");
  if (codigoParam) {
    codigoInput.value = codigoParam;
    buscar();
  }
</script>

</body>
</html>
