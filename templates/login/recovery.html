<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esqueci minha senha</title>
<style>
:root{
  --purple: #b58ef0;
  --purple-dark: #9a6de0;
  --ink: #1c1c24;
  --muted: #7a7a89;
  --border: #e6e4ee;
  --green: #22c55e;
  --toast-bg: #12141c;
  --toast-bg2: #0e2a1f;
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:#f7f6fb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:48px 16px;
  gap:32px;
}
.toast{
  display:none;
  width:100%;
  max-width:520px;
  background:linear-gradient(135deg, var(--toast-bg2) 0%, var(--toast-bg) 55%);
  border-radius:16px;
  padding:20px 24px;
  align-items:flex-start;
  gap:14px;
  color:#fff;
  box-shadow:0 20px 40px -12px rgba(0,0,0,0.35);
  animation:slideDown .5s ease;
}
.toast.show{ display:flex; }
@keyframes slideDown{
  from{opacity:0; transform:translateY(-12px);}
  to{opacity:1; transform:translateY(0);}
}
.toast-icon{
  width:28px;height:28px;
  border-radius:50%;
  background:#1e8a4c;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.toast-body{flex:1;}
.toast-title{font-size:15px;font-weight:600;margin:0 0 4px;}
.toast-text{font-size:13px;line-height:1.5;color:#c7c7d4;margin:0;}
.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:36px 32px;
  box-shadow:0 1px 2px rgba(20,20,30,0.03);
}
.card h1{
  font-size:22px;
  font-weight:700;
  color:var(--ink);
  margin:0 0 8px;
  text-align:center;
}
.card p.sub{
  font-size:14px;
  color:var(--muted);
  margin:0 0 28px;
  text-align:center;
}
label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:var(--ink);
  margin-bottom:8px;
}
.field{margin-bottom:22px;}
input[type="email"]{
  width:100%;
  padding:12px 16px;
  border:1px solid var(--border);
  border-radius:999px;
  font-size:14px;
  color:var(--ink);
  outline:none;
  transition:border-color .15s;
}
input[type="email"]:focus{
  border-color:var(--purple);
}
button.submit{
  width:100%;
  padding:13px;
  border:none;
  border-radius:999px;
  background:var(--purple);
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:background .15s, opacity .15s;
}
button.submit:hover:not(:disabled){background:var(--purple-dark);}
button.submit:disabled{opacity:.55; cursor:not-allowed;}
.erro-msg{
  margin-top:14px;
  padding:10px 14px;
  border-radius:10px;
  font-size:13px;
  background:#fdecea;
  color:#c62828;
  display:none;
  text-align:center;
}
.voltar-login{
  display:block;
  text-align:center;
  margin-top:20px;
  color:var(--purple);
  font-weight:600;
  font-size:13px;
  text-decoration:none;
}
.voltar-login:hover{color:var(--purple-dark);}
</style>
</head>
<body>

<div class="toast" id="toast">
  <div class="toast-icon">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="toast-body">
    <p class="toast-title">E-mail enviado!</p>
    <p class="toast-text">Verifique sua caixa de entrada (e o spam) e clique no link para redefinir sua senha.</p>
  </div>
</div>

<div class="card" id="card">
  <h1>Esqueci minha senha</h1>
  <p class="sub">Digite seu e-mail para receber o link de redefinição.</p>
  <form id="recoveryForm">
    <div class="field">
      <label for="emailInput">E-mail</label>
      <input type="email" id="emailInput" placeholder="seu@email.com" required>
    </div>
    <button type="submit" class="submit" id="submitBtn">Enviar link de redefinição</button>
  </form>
  <div class="erro-msg" id="erroMsg"></div>
  <a href="{{ url_for('login') }}" class="voltar-login">Lembrou a senha? Fazer login</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCKKcD1NYxO_sJVevtwoHom95pNdAwLRUw",
    authDomain: "projetoeq2alexandremarra.firebaseapp.com",
    projectId: "projetoeq2alexandremarra",
    storageBucket: "projetoeq2alexandremarra.firebasestorage.app",
    messagingSenderId: "242522510582",
    appId: "1:242522510582:web:f8bda55c7bf29b189b48d7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("recoveryForm");
  const submitBtn = document.getElementById("submitBtn");
  const erroMsg = document.getElementById("erroMsg");
  const card = document.getElementById("card");
  const toast = document.getElementById("toast");

  const actionCodeSettings = {
    url: window.location.origin + "/redefinir-senha",
  };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    erroMsg.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Enviando...";

    const email = document.getElementById("emailInput").value.trim();

    try {
      await sendPasswordResetEmail(auth, email, actionCodeSettings);
      card.style.display = "none";
      toast.classList.add("show");
    } catch (erro) {
      console.error(erro);
      let texto = "Não foi possível enviar o e-mail. Tente novamente.";
      if (erro.code === "auth/invalid-email") {
        texto = "E-mail inválido. Confira e tente de novo.";
      } else if (erro.code === "auth/user-not-found") {
        // por segurança, não revela se o e-mail existe ou não
        card.style.display = "none";
        toast.classList.add("show");
        return;
      } else if (erro.code === "auth/too-many-requests") {
        texto = "Muitas tentativas. Aguarde um pouco antes de tentar de novo.";
      }
      erroMsg.textContent = texto;
      erroMsg.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Enviar link de redefinição";
    }
  });
</script>

</body>
</html>
