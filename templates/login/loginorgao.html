<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SOS Animais Matão - Login Órgãos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/loginorgao.css') }}"/>
</head>

<body>

  <!-- Cabeçalho com a marca do site -->
  <nav class="navbar">
    <div class="container">
      <a class="navbar-brand" href="/">
        <div class="logo-icon"><i class="bi bi-heart-fill"></i></div>
        SOS Animais Matão
      </a>
    </div>
  </nav>

  <div class="page-container">

    <!-- FORMULÁRIO -->
    <div class="form-side">

      <div class="top-bar">

        <a href="/" class="btn-voltar">
          ← Voltar
        </a>

      </div>

      <div class="form-content">

        <h1>SEJA BEM-VINDO!</h1>

        <p class="subtitle">
          Entre com a conta do seu órgão para acessar o painel de denúncias.
        </p>

        <form id="formLogin">

          <!-- EMAIL -->
          <div class="input-group">

            <label for="email">E-mail</label>

            <div class="input-wrapper">
              <input
                type="email"
                id="email"
                placeholder="seuemail@exemplo.com"
                autocomplete="email"
                required
              >
            </div>

          </div>

          <!-- CNPJ -->
          <div class="input-group">

            <label for="cnpj">CNPJ</label>

            <div class="input-wrapper">
              <input
                type="text"
                id="cnpj"
                placeholder="00.000.000/0000-00"
                maxlength="18"
                required
              >
            </div>

          </div>

          <!-- SENHA -->
          <div class="input-group">

            <label for="senha">Senha</label>

            <div class="input-wrapper">
              <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="btnToggle"
                aria-label="Mostrar senha"
              >
                <svg id="eyeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

          </div>

          <!-- BOTÃO -->
          <button
            type="submit"
            class="btn-submit"
          >
            Acessar Denúncias
          </button>

          <!-- MENSAGEM -->
          <p class="login-message" id="loginMessage"></p>

        </form>

        <!-- LINKS -->
        <div class="links">
          <a href="/login/cadastroorgao">Não tem uma conta? Cadastre-se</a>
          <a href="{{ url_for('recovery') }}">Esqueci minha senha</a>
        </div>

      </div>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT: máscara de CNPJ, mostrar/ocultar senha e login
  ========================= -->

  <script>

    /* MÁSCARA DE CNPJ */

    const cnpjInput = document.getElementById('cnpj');

    cnpjInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 14) value = value.slice(0, 14);
      value = value.replace(/^(\d{2})(\d)/, '$1.$2');
      value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
      value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
      value = value.replace(/(\d{4})(\d)/, '$1-$2');
      e.target.value = value;
    });


    /* MOSTRAR / OCULTAR SENHA */

    const senhaInput = document.getElementById('senha');
    const btnToggle = document.getElementById('btnToggle');
    const eyeIcon = document.getElementById('eyeIcon');

    const eyeOpenPath = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
    const eyeOffPath = '<path d="M3 3l18 18"/><path d="M10.6 5.2A11.6 11.6 0 0 1 12 5c7 0 11 7 11 7a17.6 17.6 0 0 1-4.1 4.9M6.6 6.6C3.4 8.6 1 12 1 12s4 7 11 7a10.6 10.6 0 0 0 5.4-1.5"/><path d="M9.5 9.5a3 3 0 0 0 4.2 4.2"/>';

    btnToggle.addEventListener('click', () => {
      if (senhaInput.type === 'password') {
        senhaInput.type = 'text';
        eyeIcon.innerHTML = eyeOffPath;
        btnToggle.setAttribute('aria-label', 'Ocultar senha');
      } else {
        senhaInput.type = 'password';
        eyeIcon.innerHTML = eyeOpenPath;
        btnToggle.setAttribute('aria-label', 'Mostrar senha');
      }
    });


    /* ENVIO DO LOGIN */

    const formLogin = document.getElementById('formLogin');
    const loginMessage = document.getElementById('loginMessage');
    const emailInput = document.getElementById('email');

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();

      loginMessage.className = 'login-message';
      loginMessage.textContent = '';

      const btnSubmit = formLogin.querySelector('.btn-submit');
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Entrando...';

      try {
        const resposta = await fetch('/api/login-orgao', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: emailInput.value.trim(),
            cnpj: cnpjInput.value,
            senha: senhaInput.value
          })
        });

        const dados = await resposta.json();

        if (resposta.ok && dados.sucesso) {
          window.location.href = dados.redirect || '/dashboard';
        } else {
          const ehPendente = resposta.status === 403;
          loginMessage.className = 'login-message show ' + (ehPendente ? 'info' : 'erro');
          loginMessage.textContent = dados.erro || 'Não foi possível entrar. Tente novamente.';
        }
      } catch (err) {
        loginMessage.className = 'login-message show erro';
        loginMessage.textContent = 'Erro de conexão. Tente novamente.';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Acessar Denúncias';
      }
    });

  </script>

</body>
</html>
