<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS Animais Matão - Login Órgãos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      height: 100%;
      background-color: #ffffff;
      color: #1a1a1a;
    }

    /* Container principal: duas colunas (formulário / imagem) */
    .page-container {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Botão Voltar */
    .btn-voltar {
      position: absolute;
      top: 24px;
      right: 40px;
      background-color: #9353d3;
      color: #ffffff;
      border: none;
      padding: 10px 28px;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
      z-index: 10;
    }

    .btn-voltar:hover {
      background-color: #7e3eb8;
    }

    /* Coluna esquerda: formulário */
    .form-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 80px;
      position: relative;
    }

    .form-content {
      width: 100%;
      max-width: 420px;
    }

    .form-content h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #000000;
      margin-bottom: 32px;
      text-transform: uppercase;
    }

    /* Campos de input */
    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.95rem;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #9353d3;
    }

    .input-group input::placeholder {
      color: #a1a1aa;
    }

    /* Campo de senha com ícone de olho */
    .password-field {
      position: relative;
    }

    .password-field input {
      padding-right: 44px;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #a1a1aa;
      display: flex;
      align-items: center;
      padding: 0;
    }

    /* Botão principal */
    .btn-entrar {
      width: 100%;
      background-color: #b794f4;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 12px;
      transition: background-color 0.2s ease;
    }

    .btn-entrar:hover {
      background-color: #9353d3;
    }

    /* Coluna direita: imagem com overlay roxo e canto arredondado */
    .image-side {
      flex: 1;
      position: relative;
      overflow: hidden;
      border-top-left-radius: 60px;
      border-bottom-left-radius: 60px;
    }

    .image-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-side::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(147, 83, 211, 0.55), rgba(124, 58, 178, 0.35));
    }

    /* Responsivo */
    @media (max-width: 900px) {
      .page-container {
        flex-direction: column;
      }

      .image-side {
        min-height: 260px;
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
      }

      .form-side {
        padding: 40px 24px;
        order: 2;
      }
    }
  </style>
</head>
<body>

  <div class="page-container">
    <!-- Coluna esquerda: formulário -->
    <div class="form-side">
      <a href="/" class="btn-voltar">Voltar</a>
      <div class="form-content">
        <h1>Seja bem vindo!</h1>

        <form>
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="seuemail@exemplo.com" required />
          </div>

          <div class="input-group">
            <label for="cnpj">CNPJ</label>
            <input
              type="text"
              id="cnpj"
              placeholder="00.000.000/0000-00"
              maxlength="18"
              required
            />
          </div>

          <div class="input-group password-field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Senha" required />
            <button type="button" class="toggle-password" id="btnToggle" aria-label="Mostrar senha">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            </button>
          </div>

          <button type="submit" class="btn-entrar">Acessar Denúncias</button>
        </form>
      </div>
    </div>

    <!-- Coluna direita: imagem -->
    <div class="image-side">
      <img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=1000&q=80" alt="Pessoa com cachorro">
    </div>
  </div>

  <!-- JavaScript: máscara de CNPJ e alternar visibilidade da senha -->
  <script>
    const cnpjInput = document.getElementById('cnpj');
    cnpjInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 14) value = value.slice(0, 14);

      value = value.replace(/^(\d{2})(\d)/, '$1.$2');
      value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
      value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
      value = value.replace(/(\d{4})(\d)/, '$1-$2');

      e.target.value = value;
    });

    const senhaInput = document.getElementById('senha');
    const btnToggle = document.getElementById('btnToggle');

    btnToggle.addEventListener('click', () => {
      const isPassword = senhaInput.type === 'password';
      senhaInput.type = isPassword ? 'text' : 'password';
    });
  </script>
</body>
</html>
