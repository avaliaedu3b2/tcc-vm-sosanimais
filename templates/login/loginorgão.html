<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS Animais Matão - Login</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      height: 100%;
      background-color: #ffffff;
      color: #1a1a1a;
    }

    /* Container principal ocupando 100% da altura da tela */
    .page-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Cabeçalho fixo no topo */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 32px;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 600;
      color: #111;
    }

    .btn-voltar {
      background-color: #9353d3; /* Roxo do layout */
      color: #ffffff;
      border: none;
      padding: 10px 28px;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-voltar:hover {
      background-color: #7e3eb8;
    }

    /* Wrapper flexbox para centralização exata na tela */
    .login-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Cartão do formulário com a largura exata da imagem */
    .login-card {
      width: 100%;
      max-width: 360px;
    }

    .login-card h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #000000;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #71717a;
      margin-bottom: 24px;
    }

    /* Container dos Inputs com label flutuante/interno */
    .input-box {
      position: relative;
      border: 1px solid #d8b4fe; /* Borda roxa clara */
      border-radius: 10px;
      padding: 8px 14px;
      margin-bottom: 16px;
      background-color: #ffffff;
      transition: border-color 0.2s;
    }

    .input-box:focus-within {
      border-color: #9353d3;
    }

    .input-box label {
      display: block;
      font-size: 0.7rem;
      color: #9353d3;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .input-box input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 0.9rem;
      color: #333333;
      background: transparent;
    }

    .input-box input::placeholder {
      color: #a1a1aa;
    }

    /* Campo de Senha com o Ícone do Olho */
    .password-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-password {
      background: none;
      border: none;
      cursor: pointer;
      color: #a1a1aa;
      padding: 0;
      display: flex;
      align-items: center;
    }

    /* Checkbox "Manter-me conectado" */
    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .checkbox-container input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #9353d3;
      border-radius: 4px;
      cursor: pointer;
    }

    .checkbox-container span {
      font-size: 0.85rem;
      color: #3f3f46;
    }

    /* Botão Entrar */
    .btn-entrar {
      width: 100%;
      background-color: #9353d3;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background-color 0.2s ease;
    }

    .btn-entrar:hover {
      background-color: #7e3eb8;
    }

    /* Link inferior */
    .signup-text {
      text-align: center;
      font-size: 0.85rem;
      color: #71717a;
    }

    .signup-text a {
      color: #9353d3;
      text-decoration: none;
      font-weight: 600;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="page-container">
    <!-- Cabeçalho -->
    <header class="header">
      <div class="logo">SOS Animais Matão</div>
      <button class="btn-voltar">Voltar</button>
    </header>

    <!-- Área de Login Centralizada -->
    <main class="login-wrapper">
      <div class="login-card">
        <h2>Entrar</h2>
        <p class="subtitle">Digite seu CNPJ e senha para acessar o painel.</p>

        <form>
          <!-- Campo CNPJ (Substituindo Email) -->
          <div class="input-box">
            <label for="cnpj">CNPJ</label>
            <input 
              type="text" 
              id="cnpj" 
              placeholder="00.000.000/0000-00" 
              maxlength="18"
              required 
            />
          </div>

          <!-- Campo Senha com Olho para Ocultar/Exibir -->
          <div class="input-box">
            <label for="senha">Senha</label>
            <div class="password-wrapper">
              <input type="password" id="senha" placeholder="Senha" required />
              <button type="button" class="toggle-password" id="btnToggle" aria-label="Mostrar senha">
                <!-- Ícone SVG de olho riscado (igual da imagem) -->
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                  <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                  <line x1="2" y1="2" x2="22" y2="22"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Checkbox Manter-me conectado -->
          <label class="checkbox-container">
            <input type="checkbox" id="remember" />
            <span>Manter-me conectado</span>
          </label>

          <!-- Botão de Envio -->
          <button type="submit" class="btn-entrar">Entrar</button>
        </form>

        <!-- Link para Criar Conta -->
        <p class="signup-text">
          Ainda não tem conta? <a href="#">Crie uma</a>
        </p>
      </div>
    </main>
  </div>

  <!-- JavaScript para formatar CNPJ e alternar visibilidade da senha -->
  <script>
    // Máscara automática de CNPJ (00.000.000/0000-00)
    const cnpjInput = document.getElementById('cnpj');
    cnpjInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 14) value = value.slice(0, 14);

      value = value.replace(/^(\d{2})(\d)/, '$1.$2');
      value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
      value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
      value = value.replace(/(\d{4})(\d)/, '$1-$2');

      e.target.value = value;
    });

    // Alternar visibilidade da senha
    const senhaInput = document.getElementById('senha');
    const btnToggle = document.getElementById('btnToggle');

    btnToggle.addEventListener('click', () => {
      const isPassword = senhaInput.type === 'password';
      senhaInput.type = isPassword ? 'text' : 'password';
    });
  </script>
</body>
</html>
