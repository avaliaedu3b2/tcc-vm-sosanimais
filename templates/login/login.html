<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS Animais Matão - Login</title>
  
  <!-- CSS DIRETO NO INDEX -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #ffffff;
    }

    .page-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Topo / Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
    }

    .logo {
      font-weight: bold;
      font-size: 1.2rem;
    }

    .btn-voltar {
      background-color: #9d59d6;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* Container de centralização */
    .login-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
    }

    .input-group label {
      font-size: 0.8rem;
      color: #9d59d6;
      margin-bottom: 4px;
    }

    .input-group input {
      padding: 12px;
      border: 1px solid #e0d0f0;
      border-radius: 8px;
      outline: none;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: #444;
    }

    .btn-submit {
      width: 100%;
      background-color: #9d59d6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .signup-text {
      text-align: center;
      font-size: 0.85rem;
      color: #666;
    }

    .signup-text a {
      color: #9d59d6;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="page-container">
    <header class="header">
      <div class="logo">SOS Animais Matão</div>
      <a href="/" class="btn-voltar">Voltar</a>
    </header>

    <main class="login-wrapper">
      <div class="login-card">
        <h2>Entrar</h2>
        <p class="subtitle">Digite seu email e senha para acessar o painel.</p>

        <form>
          <div class="input-group">
            <label>Email</label>
            <input type="email" placeholder="seu@email.com" required>
          </div>

          <div class="input-group">
            <label>Senha</label>
            <input type="password" placeholder="Senha" required>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="remember">
            <label for="remember">Manter-me conectado</label>
          </div>

          <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <p class="signup-text">
          Ainda não tem conta? <a href="#">Crie uma</a>
        </p>
      </div>
    </main>
  </div>

  <!-- JAVASCRIPT DIRETO NO INDEX (opcional) -->
  <script>
    // Se precisar de alguma lógica JS no futuro, coloca aqui
  </script>
</body>
</html>
