<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SOS Animais Matão - Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}"/>
</head>

<body>

  <!-- Cabeçalho com a marca do site -->
  <nav class="navbar">
    <div class="container">
      <a class="navbar-brand" href="/">
        <div class="logo-icon"><i class="bi bi-heart-fill"></i></div>
        SOS Animais Matão
      </a>
    </div>
  </nav>

  <div class="page-container">

    <!-- FORMULÁRIO -->
    <div class="form-side">

      <div class="top-bar">

        <a href="/" class="btn-voltar">
          ← Voltar
        </a>

      </div>

      <div class="form-content">

        <h1>SEJA BEM-VINDO!</h1>

        <p class="subtitle">
          Entre na sua conta para acessar o painel do SOS Animais Matão.
        </p>

        <form id="loginForm">

          <!-- EMAIL -->
          <div class="input-group">

            <label for="email">E-mail</label>

            <div class="input-wrapper">
              <input
                type="email"
                id="email"
                placeholder="seu@email.com"
                autocomplete="email"
                required
              >
            </div>

          </div>

          <!-- SENHA -->
          <div class="input-group">

            <label for="senha">Senha</label>

            <div class="input-wrapper">
              <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="toggleSenha"
                aria-label="Mostrar senha"
              >
                <svg id="iconEye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

          </div>

          <!-- BOTÃO -->
          <button
            type="submit"
            class="btn-submit"
            id="btnLogin"
          >
            Realizar Denuncia
          </button>

          <!-- ERRO -->
          <p id="erroMsg"></p>

        </form>

        <!-- LINKS -->
        <div class="links">
          <a href="/register">Não possui uma conta? Criar</a>
          <a href="{{ url_for('recovery') }}">Esqueci minha senha</a>
        </div>

      </div>

    </div>

  </div>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCKKcD1NYxO_sJVevtwoHom95pNdAwLRUw",
      authDomain: "projetoeq2alexandremarra.firebaseapp.com",
      projectId: "projetoeq2alexandremarra",
      storageBucket: "projetoeq2alexandremarra.firebasestorage.app",
      messagingSenderId: "242522510582",
      appId: "1:242522510582:web:f8bda55c7bf29b189b48d7"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    /* MOSTRAR / OCULTAR SENHA */

    const senhaInput = document.getElementById("senha");
    const toggleSenha = document.getElementById("toggleSenha");
    const iconEye = document.getElementById("iconEye");

    const eyeOpenPath = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
    const eyeOffPath = '<path d="M3 3l18 18"/><path d="M10.6 5.2A11.6 11.6 0 0 1 12 5c7 0 11 7 11 7a17.6 17.6 0 0 1-4.1 4.9M6.6 6.6C3.4 8.6 1 12 1 12s4 7 11 7a10.6 10.6 0 0 0 5.4-1.5"/><path d="M9.5 9.5a3 3 0 0 0 4.2 4.2"/>';

    toggleSenha.addEventListener("click", () => {
      if (senhaInput.type === "password") {
        senhaInput.type = "text";
        iconEye.innerHTML = eyeOffPath;
        toggleSenha.setAttribute("aria-label", "Ocultar senha");
      } else {
        senhaInput.type = "password";
        iconEye.innerHTML = eyeOpenPath;
        toggleSenha.setAttribute("aria-label", "Mostrar senha");
      }
    });


    /* LOGIN */

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const erroMsg = document.getElementById("erroMsg");
      const btnLogin = document.getElementById("btnLogin");

      erroMsg.textContent = "";
      erroMsg.style.display = "none";

      btnLogin.disabled = true;
      btnLogin.textContent = "Entrando...";

      try {
        await signInWithEmailAndPassword(auth, email, senha);

        /*
         * Login realizado com sucesso.
         * Envia o usuário para o dashboard.
         */
         window.location.href = "/";
      } catch (error) {
        console.error(error);

        erroMsg.textContent = "E-mail ou senha inválidos.";
        erroMsg.style.display = "block";

        btnLogin.disabled = false;
        btnLogin.textContent = "Acessar site";
      }
    });
//
  </script>

</body>
</html>
