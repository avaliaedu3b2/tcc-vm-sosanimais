<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SOS Animais Matão - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f8f3fc, #ffffff);
      color: #2d1b36;
    }

    .page-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 40px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #7b3fb3;
    }

    .logo-icon {
      font-size: 1.6rem;
    }

    .btn-voltar {
      text-decoration: none;
      color: #9d59d6;
      border: 2px solid #9d59d6;
      padding: 9px 22px;
      border-radius: 25px;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-voltar:hover {
      background-color: #9d59d6;
      color: white;
    }

    /* =========================
       ÁREA DO LOGIN
    ========================= */

    .login-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px 60px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 42px;
      border-radius: 20px;
      box-shadow: 0 15px 45px rgba(120, 70, 150, 0.12);
      border: 1px solid #eee3f5;
    }

    .welcome-icon {
      width: 65px;
      height: 65px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1e5fa;
      border-radius: 50%;
      font-size: 2rem;
    }

    h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 8px;
      color: #2d1b36;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    /* =========================
       CAMPOS
    ========================= */

    .input-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .input-group label {
      color: #69408a;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 45px 14px 14px;
      border: 1px solid #dfd0e8;
      border-radius: 10px;
      outline: none;
      font-size: 0.95rem;
      transition: 0.2s;
      background: #fff;
    }

    .input-wrapper input:focus {
      border-color: #9d59d6;
      box-shadow: 0 0 0 3px rgba(157, 89, 214, 0.12);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 1.1rem;
      color: #777;
    }

    /* =========================
       CHECKBOX
    ========================= */

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 25px;
      color: #555;
      font-size: 0.85rem;
    }

    .checkbox-group input {
      accent-color: #9d59d6;
      cursor: pointer;
    }

    /* =========================
       BOTÃO
    ========================= */

    .btn-submit {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #9d59d6, #7f43b8);
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 15px rgba(126, 67, 184, 0.2);
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(126, 67, 184, 0.3);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================
       ERRO
    ========================= */

    #erroMsg {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 8px;
      background-color: #fff0f0;
      color: #d32f2f;
      text-align: center;
      font-size: 0.85rem;
    }

    /* =========================
       CADASTRO
    ========================= */

    .signup-text {
      text-align: center;
      margin-top: 25px;
      color: #777;
      font-size: 0.88rem;
    }

    .signup-text a {
      color: #9d59d6;
      text-decoration: none;
      font-weight: bold;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 600px) {

      .header {
        padding: 20px;
      }

      .logo {
        font-size: 1rem;
      }

      .btn-voltar {
        padding: 8px 16px;
      }

      .login-wrapper {
        padding: 20px 15px 40px;
      }

      .login-card {
        padding: 30px 22px;
      }

      h2 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>

<body>

  <div class="page-container">

    <!-- HEADER -->
    <header class="header">

      <div class="logo">
        <span class="logo-icon">🐾</span>
        <span>SOS Animais Matão</span>
      </div>

      <a href="/" class="btn-voltar">
        Voltar
      </a>

    </header>


    <!-- LOGIN -->
    <main class="login-wrapper">

      <div class="login-card">

        <div class="welcome-icon">
          🐶
        </div>

        <h2>Bem-vindo!</h2>

        <p class="subtitle">
          Entre na sua conta para acessar o painel
          do SOS Animais Matão.
        </p>


        <form id="loginForm">

          <!-- EMAIL -->
          <div class="input-group">

            <label for="email">
              E-mail
            </label>

            <div class="input-wrapper">

              <input
                type="email"
                id="email"
                placeholder="seu@email.com"
                autocomplete="email"
                required
              >

            </div>

          </div>


          <!-- SENHA -->
          <div class="input-group">

            <label for="senha">
              Senha
            </label>

            <div class="input-wrapper">

              <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="toggleSenha"
                aria-label="Mostrar senha"
              >
                👁️
              </button>

            </div>

          </div>


          <!-- LEMBRAR -->
          <div class="checkbox-group">

            <input
              type="checkbox"
              id="remember"
            >

            <label for="remember">
              Manter-me conectado
            </label>

          </div>


          <!-- BOTÃO -->
          <button
            type="submit"
            class="btn-submit"
            id="btnLogin"
          >
            Entrar
          </button>


          <!-- ERRO -->
          <p id="erroMsg"></p>

        </form>


        <!-- CADASTRO -->
        <p class="signup-text">

          Ainda não tem uma conta?

          <a href="/register">
            Crie uma agora
          </a>

        </p>

      </div>

    </main>

  </div>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyCKKcD1NYxO_sJVevtwoHom95pNdAwLRUw",

      authDomain:
        "projetoeq2alexandremarra.firebaseapp.com",

      projectId:
        "projetoeq2alexandremarra",

      storageBucket:
        "projetoeq2alexandremarra.firebasestorage.app",

      messagingSenderId:
        "242522510582",

      appId:
        "1:242522510582:web:f8bda55c7bf29b189b48d7"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    /* =========================
       MOSTRAR / OCULTAR SENHA
    ========================= */

    const senhaInput =
      document.getElementById("senha");

    const toggleSenha =
      document.getElementById("toggleSenha");


    toggleSenha.addEventListener("click", () => {

      if (senhaInput.type === "password") {

        senhaInput.type = "text";

        toggleSenha.textContent = "🙈";

        toggleSenha.setAttribute(
          "aria-label",
          "Ocultar senha"
        );

      } else {

        senhaInput.type = "password";

        toggleSenha.textContent = "👁️";

        toggleSenha.setAttribute(
          "aria-label",
          "Mostrar senha"
        );

      }

    });


    /* =========================
       LOGIN
    ========================= */

    document
      .getElementById("loginForm")
      .addEventListener("submit", async (e) => {

        e.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const senha =
          document
            .getElementById("senha")
            .value;


        const erroMsg =
          document.getElementById("erroMsg");


        const btnLogin =
          document.getElementById("btnLogin");


        erroMsg.textContent = "";

        erroMsg.style.display = "none";


        btnLogin.disabled = true;

        btnLogin.textContent = "Entrando...";


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            senha
          );


          /*
           * Login realizado com sucesso.
           * Envia o usuário para o dashboard.
           */

          window.location.href = "/dashboard";


        } catch (error) {

          console.error(error);


          erroMsg.textContent =
            "E-mail ou senha inválidos.";


          erroMsg.style.display = "block";


          btnLogin.disabled = false;

          btnLogin.textContent = "Entrar";

        }

      });

  </script>
<!-- ahah -->
</body>
</html>
