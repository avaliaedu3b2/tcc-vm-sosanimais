<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SOS Animais Matão - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      color: #2d1b36;
    }

    .page-container {
      min-height: 100vh;
      display: flex;
    }

    /* =========================
       LADO ESQUERDO - FORMULÁRIO
    ========================= */

    .form-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 40px 60px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 60px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #7b3fb3;
    }

    .logo-icon {
      font-size: 1.5rem;
    }

    .btn-voltar {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #9d59d6;
      border: 2px solid #9d59d6;
      padding: 8px 18px;
      border-radius: 25px;
      font-size: 0.85rem;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-voltar:hover {
      background-color: #9d59d6;
      color: white;
    }

    .form-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 380px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: #1a1123;
    }

    .subtitle {
      color: #777;
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 36px;
    }

    /* =========================
       CAMPOS
    ========================= */

    .input-group {
      margin-bottom: 22px;
    }

    .input-group label {
      display: block;
      color: #9d59d6;
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 45px 14px 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 0.95rem;
      transition: 0.2s;
      background: #fff;
    }

    .input-wrapper input:focus {
      border-color: #9d59d6;
      box-shadow: 0 0 0 3px rgba(157, 89, 214, 0.12);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      padding: 4px;
      border-radius: 6px;
      transition: 0.15s;
    }

    .password-toggle:hover {
      color: #7b3fb3;
      background: #f4ecfb;
    }

    /* =========================
       BOTÃO
    ========================= */

    .btn-submit {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #9d59d6, #7f43b8);
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 6px;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(126, 67, 184, 0.3);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================
       ERRO
    ========================= */

    #erroMsg {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 8px;
      background-color: #fff0f0;
      color: #d32f2f;
      text-align: center;
      font-size: 0.85rem;
    }

    /* =========================
       LINKS
    ========================= */

    .links {
      text-align: center;
      margin-top: 26px;
    }

    .links a {
      display: block;
      color: #555;
      text-decoration: underline;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    .links a.destaque {
      color: #7b3fb3;
      font-weight: bold;
    }

    /* =========================
       LADO DIREITO - ILUSTRAÇÃO
    ========================= */

    .image-side {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .image-side img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-side::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(106,47,158,0.15) 0%, rgba(106,47,158,0.55) 65%, rgba(90,35,140,0.88) 100%);
    }

    .illustration-wrap {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 40px 40px 56px;
    }

    .image-side h2 {
      color: white;
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .image-side p {
      color: rgba(255,255,255,0.85);
      font-size: 0.95rem;
      max-width: 320px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 860px) {

      .image-side {
        display: none;
      }

      .form-side {
        padding: 30px 24px;
      }

      .form-content {
        max-width: 420px;
      }
    }
  </style>
</head>

<body>

  <div class="page-container">

    <!-- LADO ESQUERDO -->
    <div class="form-side">

      <div class="top-bar">

        <div class="logo">
          <span class="logo-icon">🐾</span>
          <span>SOS Animais Matão</span>
        </div>

        <a href="/" class="btn-voltar">
          ← Voltar
        </a>

      </div>

      <div class="form-content">

        <h1>SEJA BEM-VINDO!</h1>

        <p class="subtitle">
          Entre na sua conta para acessar o painel do SOS Animais Matão.
        </p>

        <form id="loginForm">

          <!-- EMAIL -->
          <div class="input-group">

            <label for="email">E-mail</label>

            <div class="input-wrapper">
              <input
                type="email"
                id="email"
                placeholder="seu@email.com"
                autocomplete="email"
                required
              >
            </div>

          </div>

          <!-- SENHA -->
          <div class="input-group">

            <label for="senha">Senha</label>

            <div class="input-wrapper">
              <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="toggleSenha"
                aria-label="Mostrar senha"
              >
                <svg id="iconEye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

          </div>

          <!-- BOTÃO -->
          <button
            type="submit"
            class="btn-submit"
            id="btnLogin"
          >
            Acessar site
          </button>

          <!-- ERRO -->
          <p id="erroMsg"></p>

        </form>

        <!-- LINKS -->
        <div class="links">
          <a href="/register">Não possui uma conta? Criar</a>
          <a href="#" class="destaque">Esqueci minha senha</a>
        </div>

      </div>

    </div>

    <!-- LADO DIREITO -->
    <div class="image-side">

      <img
        src="https://images.unsplash.com/photo-1507146426996-ef05306b995a?fm=jpg&q=80&w=1200&auto=format&fit=crop"
        alt="Filhote de cachorro"
      >

      <div class="illustration-wrap">

        <h2>Cada login aproxima um focinho de um lar</h2>
        <p>Acesse o painel e ajude a conectar animais resgatados a famílias que esperam por eles em Matão.</p>

      </div>

    </div>

  </div>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCKKcD1NYxO_sJVevtwoHom95pNdAwLRUw",
      authDomain: "projetoeq2alexandremarra.firebaseapp.com",
      projectId: "projetoeq2alexandremarra",
      storageBucket: "projetoeq2alexandremarra.firebasestorage.app",
      messagingSenderId: "242522510582",
      appId: "1:242522510582:web:f8bda55c7bf29b189b48d7"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    /* MOSTRAR / OCULTAR SENHA */

    const senhaInput = document.getElementById("senha");
    const toggleSenha = document.getElementById("toggleSenha");
    const iconEye = document.getElementById("iconEye");

    const eyeOpenPath = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
    const eyeOffPath = '<path d="M3 3l18 18"/><path d="M10.6 5.2A11.6 11.6 0 0 1 12 5c7 0 11 7 11 7a17.6 17.6 0 0 1-4.1 4.9M6.6 6.6C3.4 8.6 1 12 1 12s4 7 11 7a10.6 10.6 0 0 0 5.4-1.5"/><path d="M9.5 9.5a3 3 0 0 0 4.2 4.2"/>';

    toggleSenha.addEventListener("click", () => {
      if (senhaInput.type === "password") {
        senhaInput.type = "text";
        iconEye.innerHTML = eyeOffPath;
        toggleSenha.setAttribute("aria-label", "Ocultar senha");
      } else {
        senhaInput.type = "password";
        iconEye.innerHTML = eyeOpenPath;
        toggleSenha.setAttribute("aria-label", "Mostrar senha");
      }
    });


    /* LOGIN */

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const erroMsg = document.getElementById("erroMsg");
      const btnLogin = document.getElementById("btnLogin");

      erroMsg.textContent = "";
      erroMsg.style.display = "none";

      btnLogin.disabled = true;
      btnLogin.textContent = "Entrando...";

      try {
        await signInWithEmailAndPassword(auth, email, senha);

        /*
         * Login realizado com sucesso.
         * Envia o usuário para o dashboard.
         */
        window.location.href = "/dashboard";

      } catch (error) {
        console.error(error);

        erroMsg.textContent = "E-mail ou senha inválidos.";
        erroMsg.style.display = "block";

        btnLogin.disabled = false;
        btnLogin.textContent = "Acessar site";
      }
    });

  </script>

</body>
</html>
