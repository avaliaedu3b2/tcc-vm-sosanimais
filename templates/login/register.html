<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SOS Animais Matão - Criar Conta</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      color: #2d1b36;
    }

    /* ══ Cabeçalho com a marca SOS Animais Matão ══ */
    .navbar {
      background: #fff;
      border-bottom: 1px solid #ede0f3;
      padding: 14px 0;
    }
    .navbar .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .navbar-brand {
      font-family: 'Fraunces', serif;
      font-size: 1.3rem;
      font-weight: 900;
      color: #6a1b9a;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .navbar-brand .logo-icon {
      width: 38px;
      height: 38px;
      background: #9c27b0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .navbar-brand .logo-icon i {
      color: #fff;
      font-size: 1.1rem;
    }

    .page-container {
      min-height: calc(100vh - 68px);
      display: flex;
    }

    /* =========================
       FORMULÁRIO
    ========================= */

    .form-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 40px 60px;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 60px;
    }

    .btn-voltar {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #9d59d6;
      border: 2px solid #9d59d6;
      padding: 8px 18px;
      border-radius: 25px;
      font-size: 0.85rem;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-voltar:hover {
      background-color: #9d59d6;
      color: white;
    }

    .form-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 380px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: #1a1123;
    }

    .subtitle {
      color: #777;
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 36px;
    }

    /* =========================
       CAMPOS
    ========================= */

    .input-group {
      margin-bottom: 22px;
    }

    .input-group label {
      display: block;
      color: #9d59d6;
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 45px 14px 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 0.95rem;
      transition: 0.2s;
      background: #fff;
    }

    .input-wrapper input:focus {
      border-color: #9d59d6;
      box-shadow: 0 0 0 3px rgba(157, 89, 214, 0.12);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      padding: 4px;
      border-radius: 6px;
      transition: 0.15s;
    }

    .password-toggle:hover {
      color: #7b3fb3;
      background: #f4ecfb;
    }

    /* =========================
       BOTÃO
    ========================= */

    .btn-submit {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #9d59d6, #7f43b8);
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 6px;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(126, 67, 184, 0.3);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================
       ERRO
    ========================= */

    #erroMsg {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 8px;
      background-color: #fff0f0;
      color: #d32f2f;
      text-align: center;
      font-size: 0.85rem;
    }

    /* =========================
       LINKS
    ========================= */

    .links {
      text-align: center;
      margin-top: 26px;
    }

    .links a {
      display: block;
      color: #555;
      text-decoration: underline;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    .links a.destaque {
      color: #7b3fb3;
      font-weight: bold;
    }

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 860px) {

      .form-side {
        padding: 30px 24px;
      }

      .form-content {
        max-width: 420px;
      }
    }
  </style>
</head>

<body>

  <!-- Cabeçalho com a marca do site -->
  <nav class="navbar">
    <div class="container">
      <a class="navbar-brand" href="/">
        <div class="logo-icon"><i class="bi bi-heart-fill"></i></div>
        SOS Animais Matão
      </a>
    </div>
  </nav>

  <div class="page-container">

    <!-- FORMULÁRIO -->
    <div class="form-side">

      <div class="top-bar">

        <a href="/login" class="btn-voltar">
          ← Voltar
        </a>

      </div>

      <div class="form-content">

        <h1>CRIAR CONTA</h1>

        <p class="subtitle">
          Cadastre-se para acessar o SOS Animais Matão.
        </p>

        <form id="registerForm">

          <!-- NOME -->
          <div class="input-group">

            <label for="nome">Nome completo</label>

            <div class="input-wrapper">
              <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                autocomplete="name"
                required
              >
            </div>

          </div>

          <!-- EMAIL -->
          <div class="input-group">

            <label for="email">E-mail</label>

            <div class="input-wrapper">
              <input
                type="email"
                id="email"
                placeholder="seu@email.com"
                autocomplete="email"
                required
              >
            </div>

          </div>

          <!-- SENHA -->
          <div class="input-group">

            <label for="senha">Senha</label>

            <div class="input-wrapper">
              <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                minlength="6"
                autocomplete="new-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="toggleSenha"
                aria-label="Mostrar senha"
              >
                <svg id="iconEyeSenha" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

          </div>

          <!-- CONFIRMAR SENHA -->
          <div class="input-group">

            <label for="confirmarSenha">Confirmar senha</label>

            <div class="input-wrapper">
              <input
                type="password"
                id="confirmarSenha"
                placeholder="Digite a senha novamente"
                minlength="6"
                autocomplete="new-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="toggleConfirmarSenha"
                aria-label="Mostrar senha"
              >
                <svg id="iconEyeConfirmar" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

          </div>

          <!-- BOTÃO -->
          <button
            type="submit"
            class="btn-submit"
            id="btnRegister"
          >
            Criar Conta
          </button>

          <!-- ERRO -->
          <p id="erroMsg"></p>

        </form>

        <!-- LINKS -->
        <div class="links">
          <a href="/login">Já possui uma conta? Entrar</a>
        </div>

      </div>

    </div>

  </div>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCKKcD1NYxO_sJVevtwoHom95pNdAwLRUw",
      authDomain: "projetoeq2alexandremarra.firebaseapp.com",
      projectId: "projetoeq2alexandremarra",
      storageBucket: "projetoeq2alexandremarra.firebasestorage.app",
      messagingSenderId: "242522510582",
      appId: "1:242522510582:web:f8bda55c7bf29b189b48d7"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);


    /* MOSTRAR / OCULTAR SENHA */

    function configurarToggleSenha(inputId, botaoId, iconId) {
      const input = document.getElementById(inputId);
      const botao = document.getElementById(botaoId);
      const icone = document.getElementById(iconId);

      const eyeOpenPath = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
      const eyeOffPath = '<path d="M3 3l18 18"/><path d="M10.6 5.2A11.6 11.6 0 0 1 12 5c7 0 11 7 11 7a17.6 17.6 0 0 1-4.1 4.9M6.6 6.6C3.4 8.6 1 12 1 12s4 7 11 7a10.6 10.6 0 0 0 5.4-1.5"/><path d="M9.5 9.5a3 3 0 0 0 4.2 4.2"/>';

      botao.addEventListener("click", () => {
        if (input.type === "password") {
          input.type = "text";
          icone.innerHTML = eyeOffPath;
          botao.setAttribute("aria-label", "Ocultar senha");
        } else {
          input.type = "password";
          icone.innerHTML = eyeOpenPath;
          botao.setAttribute("aria-label", "Mostrar senha");
        }
      });
    }

    configurarToggleSenha("senha", "toggleSenha", "iconEyeSenha");
    configurarToggleSenha("confirmarSenha", "toggleConfirmarSenha", "iconEyeConfirmar");


    /* CRIAR CONTA */

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const confirmarSenha = document.getElementById("confirmarSenha").value;
      const erroMsg = document.getElementById("erroMsg");
      const btnRegister = document.getElementById("btnRegister");

      erroMsg.textContent = "";
      erroMsg.style.display = "none";

      if (senha !== confirmarSenha) {
        erroMsg.textContent = "As senhas não são iguais.";
        erroMsg.style.display = "block";
        return;
      }

      btnRegister.disabled = true;
      btnRegister.textContent = "Criando conta...";

      try {

        // Cria usuário no Firebase Authentication
        const resultado = await createUserWithEmailAndPassword(auth, email, senha);
        const usuario = resultado.user;

        // Salva o nome no perfil do Firebase
        await updateProfile(usuario, {
          displayName: nome
        });

        // Salva os dados no Firestore
        await setDoc(
          doc(db, "users", usuario.uid),
          {
            nome: nome,
            email: email,
            tipo: "usuario",
            criadoEm: serverTimestamp()
          }
        );

        // Vai para o login
        window.location.href = "/login";

      } catch (error) {

        console.error("ERRO COMPLETO:", error);
        console.error("Código:", error.code);
        console.error("Mensagem:", error.message);

        if (error.code === "auth/email-already-in-use") {
          erroMsg.textContent = "Este e-mail já possui uma conta. Tente outro e-mail.";
        } else if (error.code === "auth/invalid-email") {
          erroMsg.textContent = "Digite um e-mail válido.";
        } else if (error.code === "auth/weak-password") {
          erroMsg.textContent = "A senha precisa ter pelo menos 6 caracteres.";
        } else {
          erroMsg.textContent = "Não foi possível criar a conta. Código: " + error.code;
        }

        erroMsg.style.display = "block";
        btnRegister.disabled = false;
        btnRegister.textContent = "Criar Conta";
      }

    });

  </script>

</body>
</html>
