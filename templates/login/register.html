<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SOS Animais Matão - Criar Conta</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}"/>
</head>

<body>

  <!-- Cabeçalho com a marca do site -->
  <nav class="navbar">
    <div class="container">
      <a class="navbar-brand" href="/">
        <div class="logo-icon"><i class="bi bi-heart-fill"></i></div>
        SOS Animais Matão
      </a>
    </div>
  </nav>

  <div class="page-container">

    <!-- FORMULÁRIO -->
    <div class="form-side">

      <div class="top-bar">

        <a href="/login" class="btn-voltar">
          ← Voltar
        </a>

      </div>

      <div class="form-content">

        <h1>CRIAR CONTA</h1>

        <p class="subtitle">
          Cadastre-se para acessar o SOS Animais Matão.
        </p>

        <form id="registerForm">

          <!-- NOME -->
          <div class="input-group">

            <label for="nome">Nome completo</label>

            <div class="input-wrapper">
              <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                autocomplete="name"
                required
              >
            </div>

          </div>

          <!-- EMAIL -->
          <div class="input-group">

            <label for="email">E-mail</label>

            <div class="input-wrapper">
              <input
                type="email"
                id="email"
                placeholder="seu@email.com"
                autocomplete="email"
                required
              >
            </div>

          </div>

          <!-- SENHA -->
          <div class="input-group">

            <label for="senha">Senha</label>

            <div class="input-wrapper">
              <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                minlength="6"
                autocomplete="new-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="toggleSenha"
                aria-label="Mostrar senha"
              >
                <svg id="iconEyeSenha" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

          </div>

          <!-- CONFIRMAR SENHA -->
          <div class="input-group">

            <label for="confirmarSenha">Confirmar senha</label>

            <div class="input-wrapper">
              <input
                type="password"
                id="confirmarSenha"
                placeholder="Digite a senha novamente"
                minlength="6"
                autocomplete="new-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="toggleConfirmarSenha"
                aria-label="Mostrar senha"
              >
                <svg id="iconEyeConfirmar" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

          </div>

          <!-- BOTÃO -->
          <button
            type="submit"
            class="btn-submit"
            id="btnRegister"
          >
            Criar Conta
          </button>

          <!-- ERRO -->
          <p id="erroMsg"></p>

        </form>

        <!-- LINKS -->
        <div class="links">
          <a href="/login">Já possui uma conta? Entrar</a>
        </div>

      </div>

    </div>

  </div>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCKKcD1NYxO_sJVevtwoHom95pNdAwLRUw",
      authDomain: "projetoeq2alexandremarra.firebaseapp.com",
      projectId: "projetoeq2alexandremarra",
      storageBucket: "projetoeq2alexandremarra.firebasestorage.app",
      messagingSenderId: "242522510582",
      appId: "1:242522510582:web:f8bda55c7bf29b189b48d7"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);


    /* MOSTRAR / OCULTAR SENHA */

    function configurarToggleSenha(inputId, botaoId, iconId) {
      const input = document.getElementById(inputId);
      const botao = document.getElementById(botaoId);
      const icone = document.getElementById(iconId);

      const eyeOpenPath = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
      const eyeOffPath = '<path d="M3 3l18 18"/><path d="M10.6 5.2A11.6 11.6 0 0 1 12 5c7 0 11 7 11 7a17.6 17.6 0 0 1-4.1 4.9M6.6 6.6C3.4 8.6 1 12 1 12s4 7 11 7a10.6 10.6 0 0 0 5.4-1.5"/><path d="M9.5 9.5a3 3 0 0 0 4.2 4.2"/>';

      botao.addEventListener("click", () => {
        if (input.type === "password") {
          input.type = "text";
          icone.innerHTML = eyeOffPath;
          botao.setAttribute("aria-label", "Ocultar senha");
        } else {
          input.type = "password";
          icone.innerHTML = eyeOpenPath;
          botao.setAttribute("aria-label", "Mostrar senha");
        }
      });
    }

    configurarToggleSenha("senha", "toggleSenha", "iconEyeSenha");
    configurarToggleSenha("confirmarSenha", "toggleConfirmarSenha", "iconEyeConfirmar");


    /* CRIAR CONTA */

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const confirmarSenha = document.getElementById("confirmarSenha").value;
      const erroMsg = document.getElementById("erroMsg");
      const btnRegister = document.getElementById("btnRegister");

      erroMsg.textContent = "";
      erroMsg.style.display = "none";

      if (senha !== confirmarSenha) {
        erroMsg.textContent = "As senhas não são iguais.";
        erroMsg.style.display = "block";
        return;
      }

      btnRegister.disabled = true;
      btnRegister.textContent = "Criando conta...";

      try {

        // Cria usuário no Firebase Authentication
        const resultado = await createUserWithEmailAndPassword(auth, email, senha);
        const usuario = resultado.user;

        // Salva o nome no perfil do Firebase
        await updateProfile(usuario, {
          displayName: nome
        });

        // Salva os dados no Firestore
        await setDoc(
          doc(db, "users", usuario.uid),
          {
            nome: nome,
            email: email,
            tipo: "usuario",
            criadoEm: serverTimestamp()
          }
        );

        // Vai para o login
        window.location.href = "/login";

      } catch (error) {

        console.error("ERRO COMPLETO:", error);
        console.error("Código:", error.code);
        console.error("Mensagem:", error.message);

        if (error.code === "auth/email-already-in-use") {
          erroMsg.textContent = "Este e-mail já possui uma conta. Tente outro e-mail.";
        } else if (error.code === "auth/invalid-email") {
          erroMsg.textContent = "Digite um e-mail válido.";
        } else if (error.code === "auth/weak-password") {
          erroMsg.textContent = "A senha precisa ter pelo menos 6 caracteres.";
        } else {
          erroMsg.textContent = "Não foi possível criar a conta. Código: " + error.code;
        }

        erroMsg.style.display = "block";
        btnRegister.disabled = false;
        btnRegister.textContent = "Criar Conta";
      }

    });

  </script>

</body>
</html>
