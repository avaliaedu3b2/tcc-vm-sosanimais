<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SOS Animais Matão - Cadastro de Órgãos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastroorgao.css') }}"/>
</head>

<body>

  <!-- Cabeçalho com a marca do site -->
  <nav class="navbar">
    <div class="container">
      <a class="navbar-brand" href="/">
        <div class="logo-icon"><i class="bi bi-heart-fill"></i></div>
        SOS Animais Matão
      </a>
    </div>
  </nav>

  <div class="page-container">

    <!-- FORMULÁRIO -->
    <div class="form-side">

      <div class="top-bar">

        <a href="/login/orgaos" class="btn-voltar">
          ← Voltar
        </a>

      </div>

      <div class="form-content">

        <h1>CADASTRE SEU ÓRGÃO!</h1>

        <p class="subtitle">
          Crie uma conta para acompanhar e responder às denúncias.
        </p>

        <form id="formCadastro" novalidate>

          <!-- NOME DO ÓRGÃO -->
          <div class="input-group">

            <label for="nomeOrgao">Nome do órgão</label>

            <div class="input-wrapper">
              <input
                type="text"
                id="nomeOrgao"
                placeholder="Ex: Secretaria de Bem-Estar Animal"
                required
              >
            </div>

            <small class="error">Informe o nome do órgão.</small>

          </div>

          <!-- EMAIL -->
          <div class="input-group">

            <label for="email">E-mail</label>

            <div class="input-wrapper">
              <input
                type="email"
                id="email"
                placeholder="seuemail@exemplo.com"
                autocomplete="email"
                required
              >
            </div>

            <small class="error">Informe um email válido.</small>

          </div>

          <!-- CNPJ -->
          <div class="input-group">

            <label for="cnpj">CNPJ</label>

            <div class="input-wrapper">
              <input
                type="text"
                id="cnpj"
                placeholder="00.000.000/0000-00"
                maxlength="18"
                required
              >
            </div>

            <small class="error">Informe um CNPJ válido.</small>
            <small class="cnpj-status" id="cnpjStatus"></small>

          </div>

          <!-- SENHA -->
          <div class="input-group">

            <label for="senha">Senha</label>

            <div class="input-wrapper">
              <input
                type="password"
                id="senha"
                placeholder="Mínimo de 8 caracteres"
                minlength="8"
                autocomplete="new-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                data-target="senha"
                aria-label="Mostrar senha"
              >
                <svg class="eyeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

            <small class="error">A senha deve ter no mínimo 8 caracteres.</small>

          </div>

          <!-- CONFIRMAR SENHA -->
          <div class="input-group">

            <label for="confirmarSenha">Confirmar senha</label>

            <div class="input-wrapper">
              <input
                type="password"
                id="confirmarSenha"
                placeholder="Repita a senha"
                autocomplete="new-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                data-target="confirmarSenha"
                aria-label="Mostrar senha"
              >
                <svg class="eyeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

            <small class="error">As senhas não coincidem.</small>

          </div>

          <!-- BOTÃO -->
          <button
            type="submit"
            class="btn-submit"
          >
            Criar Conta
          </button>

        </form>

        <!-- LINKS -->
        <div class="links">
          <a href="/login/loginorgao">Já tem uma conta? Entrar</a>
        </div>

      </div>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT: máscara de CNPJ, verificação na Receita, mostrar/ocultar senha e validação
  ========================= -->

  <script>

    /* MÁSCARA E VERIFICAÇÃO DE CNPJ */

    const cnpjInput = document.getElementById('cnpj');
    const cnpjStatus = document.getElementById('cnpjStatus');
    let cnpjEstado = null; // null | 'confirmado' | 'nao_encontrado' | 'indisponivel'

    cnpjInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 14) value = value.slice(0, 14);
      value = value.replace(/^(\d{2})(\d)/, '$1.$2');
      value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
      value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
      value = value.replace(/(\d{4})(\d)/, '$1-$2');
      e.target.value = value;

      // Reseta o status enquanto o CNPJ ainda está sendo digitado/alterado
      cnpjEstado = null;
      cnpjStatus.className = 'cnpj-status';
      cnpjStatus.textContent = '';

      const digitos = value.replace(/\D/g, '');
      if (digitos.length === 14) {
        verificarCnpjNaReceita(digitos);
      }
    });

    async function verificarCnpjNaReceita(cnpjDigitos) {
      cnpjStatus.className = 'cnpj-status show checking';
      cnpjStatus.textContent = 'Verificando CNPJ na Receita Federal...';

      try {
        const resposta = await fetch(`/api/consultar-cnpj/${cnpjDigitos}`);
        const dados = await resposta.json();

        if (resposta.ok && dados.valido) {
          cnpjEstado = 'confirmado';
          cnpjStatus.className = 'cnpj-status show found';
          cnpjStatus.textContent = `✓ ${dados.razao_social || 'CNPJ encontrado'}`;
          setInvalid(cnpjInput, false);

          // Preenche o nome do órgão automaticamente, se estiver vazio
          if (nomeOrgao.value.trim() === '' && dados.razao_social) {
            nomeOrgao.value = dados.razao_social;
          }
        } else if (resposta.status === 404) {
          cnpjEstado = 'nao_encontrado';
          cnpjStatus.className = 'cnpj-status show not-found';
          cnpjStatus.textContent = dados.erro || 'CNPJ não encontrado na Receita Federal.';
        } else {
          // Receita indisponível/instável: não bloqueia o cadastro, só avisa.
          // A conferência final é feita manualmente na hora da aprovação.
          cnpjEstado = 'indisponivel';
          cnpjStatus.className = 'cnpj-status show checking';
          cnpjStatus.textContent = 'Não foi possível confirmar automaticamente agora — o CNPJ será conferido na aprovação.';
        }
      } catch (err) {
        cnpjEstado = 'indisponivel';
        cnpjStatus.className = 'cnpj-status show checking';
        cnpjStatus.textContent = 'Não foi possível confirmar automaticamente agora — o CNPJ será conferido na aprovação.';
      }
    }


    /* MOSTRAR / OCULTAR SENHA (funciona para os dois campos) */

    const eyeOpenPath = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
    const eyeOffPath = '<path d="M3 3l18 18"/><path d="M10.6 5.2A11.6 11.6 0 0 1 12 5c7 0 11 7 11 7a17.6 17.6 0 0 1-4.1 4.9M6.6 6.6C3.4 8.6 1 12 1 12s4 7 11 7a10.6 10.6 0 0 0 5.4-1.5"/><path d="M9.5 9.5a3 3 0 0 0 4.2 4.2"/>';

    document.querySelectorAll('.password-toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const targetInput = document.getElementById(btn.dataset.target);
        const icone = btn.querySelector('.eyeIcon');

        if (targetInput.type === 'password') {
          targetInput.type = 'text';
          icone.innerHTML = eyeOffPath;
          btn.setAttribute('aria-label', 'Ocultar senha');
        } else {
          targetInput.type = 'password';
          icone.innerHTML = eyeOpenPath;
          btn.setAttribute('aria-label', 'Mostrar senha');
        }
      });
    });


    /* VALIDAÇÃO E ENVIO */

    const form = document.getElementById('formCadastro');
    const nomeOrgao = document.getElementById('nomeOrgao');
    const email = document.getElementById('email');
    const senha = document.getElementById('senha');
    const confirmarSenha = document.getElementById('confirmarSenha');

    function setInvalid(input, isInvalid) {
      input.closest('.input-group').classList.toggle('invalid', isInvalid);
    }

    function validarCNPJ(cnpj) {
      return cnpj.replace(/\D/g, '').length === 14;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      let valido = true;

      setInvalid(nomeOrgao, nomeOrgao.value.trim() === '');
      if (nomeOrgao.value.trim() === '') valido = false;

      const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);
      setInvalid(email, !emailValido);
      if (!emailValido) valido = false;

      const cnpjValido = validarCNPJ(cnpjInput.value) && cnpjEstado !== 'nao_encontrado';
      setInvalid(cnpjInput, !cnpjValido);
      if (!cnpjValido) valido = false;

      const senhaValida = senha.value.length >= 8;
      setInvalid(senha, !senhaValida);
      if (!senhaValida) valido = false;

      const senhasIguais = confirmarSenha.value === senha.value && confirmarSenha.value !== '';
      setInvalid(confirmarSenha, !senhasIguais);
      if (!senhasIguais) valido = false;

      if (valido) {
        const btnSubmit = form.querySelector('.btn-submit');
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Enviando...';

        try {
          const resposta = await fetch('/api/cadastro-orgao', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              nomeOrgao: nomeOrgao.value.trim(),
              email: email.value.trim(),
              cnpj: cnpjInput.value,
              senha: senha.value,
              cnpjVerificado: cnpjEstado === 'confirmado'
            })
          });
          const dados = await resposta.json();

          if (resposta.ok && dados.sucesso) {
            form.innerHTML = `<p style="color:#2e7d32; font-size:0.95rem; line-height:1.5;">${dados.mensagem}</p>`;
          } else {
            alert(dados.erro || 'Não foi possível concluir o cadastro. Tente novamente.');
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Criar Conta';
          }
        } catch (err) {
          alert('Erro de conexão. Tente novamente.');
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Criar Conta';
        }
      }
    });

  </script>

</body>
</html>
