<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS Animais Matão - Cadastro de Órgãos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body, html {
      height: 100%;
      background-color: #ffffff;
      color: #1a1a1a;
    }
    /* Container principal: duas colunas (formulário / imagem) */
    .page-container {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }
    /* Botão Voltar */
    .btn-voltar {
      position: absolute;
      top: 24px;
      right: 40px;
      background-color: #9353d3;
      color: #ffffff;
      border: none;
      padding: 10px 28px;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
      z-index: 10;
    }
    .btn-voltar:hover {
      background-color: #7e3eb8;
    }
    /* Coluna esquerda: formulário */
    .form-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 80px;
      position: relative;
      overflow-y: auto;
    }
    .form-content {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }
    .form-content h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #000000;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .form-content .subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 32px;
    }
    /* Campos de input */
    .input-group {
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .input-group input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.95rem;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus {
      border-color: #9353d3;
    }
    .input-group input::placeholder {
      color: #a1a1aa;
    }
    .input-group small.error {
      display: none;
      color: #dc2626;
      font-size: 0.75rem;
      margin-top: 6px;
    }
    .input-group.invalid input {
      border-color: #dc2626;
    }
    .input-group.invalid small.error {
      display: block;
    }
    .cnpj-status {
      display: none;
      font-size: 0.75rem;
      margin-top: 6px;
    }
    .cnpj-status.show {
      display: block;
    }
    .cnpj-status.checking {
      color: #6b7280;
    }
    .cnpj-status.found {
      color: #16a34a;
    }
    .cnpj-status.not-found {
      color: #dc2626;
    }
    /* Campo de senha com ícone de olho */
    .password-field {
      position: relative;
    }
    .password-field input {
      padding-right: 44px;
    }
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #a1a1aa;
      display: flex;
      align-items: center;
      padding: 0;
    }
    /* Botão principal */
    .btn-entrar {
      width: 100%;
      background-color: #b794f4;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 12px;
      transition: background-color 0.2s ease;
    }
    .btn-entrar:hover {
      background-color: #9353d3;
    }
    /* Link para login */
    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #6b7280;
    }
    .login-link a {
      color: #9353d3;
      font-weight: 600;
      text-decoration: none;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
    /* Coluna direita: imagem com overlay roxo e canto arredondado */
    .image-side {
      flex: 1;
      position: relative;
      overflow: hidden;
      border-top-left-radius: 60px;
      border-bottom-left-radius: 60px;
    }
    .image-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .image-side::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(147, 83, 211, 0.55), rgba(124, 58, 178, 0.35));
    }
    /* Responsivo */
    @media (max-width: 900px) {
      .page-container {
        flex-direction: column;
      }
      .image-side {
        min-height: 220px;
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
      }
      .form-side {
        padding: 40px 24px;
        order: 2;
      }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <!-- Coluna esquerda: formulário -->
    <div class="form-side">
      <a href="/" class="btn-voltar">Voltar</a>

      <div class="form-content">
        <h1>Cadastre seu órgão!</h1>
        <p class="subtitle">Crie uma conta para acompanhar e responder às denúncias.</p>

        <form id="formCadastro" novalidate>
          <div class="input-group">
            <label for="nomeOrgao">Nome do órgão</label>
            <input
              type="text"
              id="nomeOrgao"
              placeholder="Ex: Secretaria de Bem-Estar Animal"
              required
            />
            <small class="error">Informe o nome do órgão.</small>
          </div>

          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="seuemail@exemplo.com" required />
            <small class="error">Informe um email válido.</small>
          </div>

          <div class="input-group">
            <label for="cnpj">CNPJ</label>
            <input
              type="text"
              id="cnpj"
              placeholder="00.000.000/0000-00"
              maxlength="18"
              required
            />
            <small class="error">Informe um CNPJ válido.</small>
            <small class="cnpj-status" id="cnpjStatus"></small>
          </div>

          <div class="input-group password-field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Mínimo de 8 caracteres" minlength="8" required />
            <button type="button" class="toggle-password" data-target="senha" aria-label="Mostrar senha">
              <svg class="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            </button>
            <small class="error">A senha deve ter no mínimo 8 caracteres.</small>
          </div>

          <div class="input-group password-field">
            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" id="confirmarSenha" placeholder="Repita a senha" required />
            <button type="button" class="toggle-password" data-target="confirmarSenha" aria-label="Mostrar senha">
              <svg class="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            </button>
            <small class="error">As senhas não coincidem.</small>
          </div>

          <button type="submit" class="btn-entrar">Criar conta</button>
        </form>

        <p class="login-link">Já tem uma conta? <a href="/login/loginorgao">Entrar</a></p>
      </div>
    </div>

    <!-- Coluna direita: imagem -->
    <div class="image-side">
      <img
        src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=1000&q=80"
        alt="Pessoa com cachorro">
    </div>
  </div>

  <!-- JavaScript: máscara de CNPJ, alternar visibilidade da senha e validação -->
  <script>
    // Máscara de CNPJ
    const cnpjInput = document.getElementById('cnpj');
    const cnpjStatus = document.getElementById('cnpjStatus');
    let cnpjConfirmado = false; // true somente quando a Receita Federal confirma o CNPJ

    cnpjInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 14) value = value.slice(0, 14);
      value = value.replace(/^(\d{2})(\d)/, '$1.$2');
      value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
      value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
      value = value.replace(/(\d{4})(\d)/, '$1-$2');
      e.target.value = value;

      // Reseta o status enquanto o CNPJ ainda está sendo digitado/alterado
      cnpjConfirmado = false;
      cnpjStatus.className = 'cnpj-status';
      cnpjStatus.textContent = '';

      const digitos = value.replace(/\D/g, '');
      if (digitos.length === 14) {
        verificarCnpjNaReceita(digitos);
      }
    });

    async function verificarCnpjNaReceita(cnpjDigitos) {
      cnpjStatus.className = 'cnpj-status show checking';
      cnpjStatus.textContent = 'Verificando CNPJ na Receita Federal...';

      try {
        const resposta = await fetch(`/api/consultar-cnpj/${cnpjDigitos}`);
        const dados = await resposta.json();

        if (resposta.ok && dados.valido) {
          cnpjConfirmado = true;
          cnpjStatus.className = 'cnpj-status show found';
          cnpjStatus.textContent = `✓ ${dados.razao_social || 'CNPJ encontrado'}`;
          setInvalid(cnpjInput, false);

          // Preenche o nome do órgão automaticamente, se estiver vazio
          if (nomeOrgao.value.trim() === '' && dados.razao_social) {
            nomeOrgao.value = dados.razao_social;
          }
        } else {
          cnpjConfirmado = false;
          cnpjStatus.className = 'cnpj-status show not-found';
          cnpjStatus.textContent = dados.erro || 'CNPJ não encontrado na Receita Federal.';
        }
      } catch (err) {
        cnpjConfirmado = false;
        cnpjStatus.className = 'cnpj-status show not-found';
        cnpjStatus.textContent = 'Não foi possível verificar o CNPJ agora. Tente novamente.';
      }
    }

    // Alternar visibilidade de senha (funciona para os dois campos)
    document.querySelectorAll('.toggle-password').forEach((btn) => {
      btn.addEventListener('click', () => {
        const targetInput = document.getElementById(btn.dataset.target);
        const isPassword = targetInput.type === 'password';
        targetInput.type = isPassword ? 'text' : 'password';
      });
    });

    // Validação simples no envio
    const form = document.getElementById('formCadastro');
    const nomeOrgao = document.getElementById('nomeOrgao');
    const email = document.getElementById('email');
    const senha = document.getElementById('senha');
    const confirmarSenha = document.getElementById('confirmarSenha');

    function setInvalid(input, isInvalid) {
      input.closest('.input-group').classList.toggle('invalid', isInvalid);
    }

    function validarCNPJ(cnpj) {
      return cnpj.replace(/\D/g, '').length === 14;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      let valido = true;

      setInvalid(nomeOrgao, nomeOrgao.value.trim() === '');
      if (nomeOrgao.value.trim() === '') valido = false;

      const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);
      setInvalid(email, !emailValido);
      if (!emailValido) valido = false;

      const cnpjValido = validarCNPJ(cnpjInput.value) && cnpjConfirmado;
      setInvalid(cnpjInput, !cnpjValido);
      if (!cnpjValido) {
        valido = false;
        if (!cnpjConfirmado) {
          cnpjStatus.className = 'cnpj-status show not-found';
          cnpjStatus.textContent = 'Aguarde a confirmação do CNPJ na Receita Federal antes de continuar.';
        }
      }

      const senhaValida = senha.value.length >= 8;
      setInvalid(senha, !senhaValida);
      if (!senhaValida) valido = false;

      const senhasIguais = confirmarSenha.value === senha.value && confirmarSenha.value !== '';
      setInvalid(confirmarSenha, !senhasIguais);
      if (!senhasIguais) valido = false;

      if (valido) {
        const btnSubmit = form.querySelector('.btn-entrar');
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Enviando...';

        try {
          const resposta = await fetch('/api/cadastro-orgao', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              nomeOrgao: nomeOrgao.value.trim(),
              email: email.value.trim(),
              cnpj: cnpjInput.value,
              senha: senha.value
            })
          });
          const dados = await resposta.json();

          if (resposta.ok && dados.sucesso) {
            form.innerHTML = `<p style="color:#16a34a; font-size:0.95rem; line-height:1.5;">${dados.mensagem}</p>`;
          } else {
            alert(dados.erro || 'Não foi possível concluir o cadastro. Tente novamente.');
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Criar conta';
          }
        } catch (err) {
          alert('Erro de conexão. Tente novamente.');
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Criar conta';
        }
      }
    });
  </script>
</body>
</html>
